[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "its-parser"
version = "0.1.0"
description = "Парсер документации 1С ИТС"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.2",
    "selenium>=4.0.0",
    "python-dotenv>=0.19.0",
    "urllib3>=1.26.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
rag = [
    "qdrant-client[fastembed]",
    "fastmcp",
    "beautifulsoup4",
    "markdownify",
]
dev = [
    "pytest",
]

[project.scripts]
its-parser = "its_parser.cli:main"
its-index = "its_parser.rag.cli:index_main"

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: тесты с реальными моделями fastembed (скачивают модели)"]

[tool.hatch.build.targets.wheel]
packages = ["src/its_parser"]