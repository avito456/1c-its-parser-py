[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "its-parser"
version = "0.1.0"
description = "Парсер документации 1С ИТС"
requires-python = ">=3.9"
dependencies = [
    "requests==2.28.2",
    "selenium>=4.0.0",
    "python-dotenv>=0.19.0",
    "urllib3>=1.26.0",
    "loguru>=0.7.0",
]

[project.scripts]
its-parser = "its_parser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/its_parser"]